schema: spec-driven

context: |
  Language: Portuguese (pt-BR)
  All artifacts must be written in Brazilian Portuguese.
  Keep technical terms like "API", "REST", "GraphQL" in English
  We use conventional commits, commit in portuguese
  Commits have to be long and give context about the change, not just "fix bug" or "add feature"
  Tech Stack: Vue 3, Quasar, Firebase (Auth and Firestore), TypeScript, Composition API, Pinia, Vite, PWA
  Tests: Cypress

rules:
  design:
    - O design técnico DEVE conter pelo menos um diagrama de blocos ou de fluxo usando sintaxe ```mermaid.
    - Utilize cabeçalhos Markdown para facilitar a geração do Outline (Índice) automático no VS Code.
  proposal:
    - Inclua o plano de rollback
    - Resuma o impacto visual e as conexões da nova funcionalidade com os módulos existentes.
  specs:
    - Use Given/When/Then format
    - Reference existing patterns before inventing new ones
    - Quando atualizar a Fonte da Verdade (spec.md), garanta que os diagramas Mermaid sejam atualizados para refletir o novo fluxo.
    - A spec final DEVE conter pelo menos um diagrama de blocos ou de fluxo usando sintaxe ```mermaid
  tasks:
    - Use checkboxes to track progress
    - Tasks DEVE ser granular o suficiente para permitir que cada item seja implementado e testado de forma independente.
    - Cada tarefa DEVE ter um resultado esperado claro e verificável.
    - Utilize SEMPRE HTML semântico para estruturar o conteúdo, evitando o uso de `<div>` e `<span>` sem necessidade.
    - Garanta acessibilidade (a11y) em todos os elementos interativos, incluindo botões, links e campos de formulário.
